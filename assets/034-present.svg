<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Present Box Body -->
  <rect x="5" y="10" width="14" height="10" rx="1.5" fill="#2c2f88" fill-opacity="0.20" stroke="#ECEFF4" stroke-width="1.8" stroke-linejoin="round" />
  <!-- Present Box Lid -->
  <rect x="4" y="7" width="16" height="3" rx="1" fill="#2c2f88" fill-opacity="0.20" stroke="#ECEFF4" stroke-width="1.8" stroke-linejoin="round" />
  <!-- Ribbon Vertical Line -->
  <line x1="12" y1="7" x2="12" y2="20" stroke="#6ECA09" stroke-width="1.8" stroke-linecap="round" />
  <!-- Left Bow Loop -->
  <path d="M12 7 C 10 4.5, 7 3, 7 5.5 C 7 7.5, 10 7, 12 7" fill="#6ECA09" fill-opacity="0.25" stroke="#6ECA09" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Right Bow Loop -->
  <path d="M12 7 C 14 4.5, 17 3, 17 5.5 C 17 7.5, 14 7, 12 7" fill="#6ECA09" fill-opacity="0.25" stroke="#6ECA09" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Left Bow Tail -->
  <path d="M12 7c-1 1.5-2 3.5-1.5 5" fill="none" stroke="#6ECA09" stroke-width="1.8" stroke-linecap="round" />
  <!-- Right Bow Tail -->
  <path d="M12 7c1 1.5 2 3.5 1.5 5" fill="none" stroke="#6ECA09" stroke-width="1.8" stroke-linecap="round" />
  <!-- Center Bow Knot -->
  <circle cx="12" cy="7" r="1.5" fill="#6ECA09" />
</svg>