name: banksync_app
description: Ala Taier (عَ الطاير) — digital wallet built on the UFF core banking system.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dio: ^5.7.0
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  google_fonts: ^6.2.1
  intl: ^0.20.2
  local_auth: ^2.3.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.2
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2
  freerasp: ^8.0.0
  pdf: ^3.11.0
  printing: ^5.13.0
  share_plus: ^10.1.4
  uuid: ^4.5.1
  flutter_svg: ^2.0.10
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.1
  firebase_crashlytics: ^5.2.4
  flutter_local_notifications: ^18.0.1
  iconsax_flutter: ^1.0.1
  phosphor_flutter: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_logo.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/branding/app_logo.png

flutter:
  uses-material-design: true
  assets:
    - assets/config/app_config.json
    - assets/branding/app_logo.png
    - assets/branding/ubs.svg
    - assets/icons/
    - assets/telecom/
    - assets/pay/


  fonts:
    - family: LamaSans
      fonts:
        - asset: assets/fonts/LamaSans-Regular.ttf
        - asset: assets/fonts/LamaSans-RegularItalic.ttf
          style: italic
        - asset: assets/fonts/LamaSans-Light.ttf
          weight: 300
        - asset: assets/fonts/LamaSans-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/LamaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/LamaSans-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/LamaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/LamaSans-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/LamaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/LamaSans-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/LamaSans-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/LamaSans-ExtraBoldItalic.ttf
          weight: 800
          style: italic
        - asset: assets/fonts/LamaSans-Black.ttf
          weight: 900
        - asset: assets/fonts/LamaSans-BlackItalic.ttf
          weight: 900
          style: italic
    - family: InstagramSansARA
      fonts:
        - asset: assets/fonts/Instagram Sans ARA.ttf
        - asset: assets/fonts/Instagram Sans ARA Bold.ttf
          weight: 700
    - family: iOS15Arabic
      fonts:
        - asset: assets/fonts/iOS15-Arabic.ttf
    - family: SFProArabic
      fonts:
        - asset: assets/fonts/SFProArabic-Regular.ttf
        - asset: assets/fonts/SFProArabic-Light.ttf
          weight: 300
        - asset: assets/fonts/SFProArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/SFProArabic-Bold.ttf
          weight: 700

