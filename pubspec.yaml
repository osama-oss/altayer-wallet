name: banksync_app
description: Ultimate Wallet — digital wallet built on the UFF core banking system.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dio: ^5.7.0
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  google_fonts: ^6.2.1
  intl: ^0.20.2
  local_auth: ^2.3.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.2
  image_picker: ^1.1.2
  gal: ^2.3.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2
  freerasp: ^8.0.0
  pdf: ^3.11.0
  printing: ^5.13.0
  share_plus: ^10.1.4
  uuid: ^4.5.1
  flutter_svg: ^2.0.10
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.1
  firebase_crashlytics: ^5.2.4
  flutter_local_notifications: ^18.0.1
  iconsax_flutter: ^1.0.1
  phosphor_flutter: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_logo.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/branding/app_logo.png

flutter:
  uses-material-design: true
  assets:
    - assets/config/app_config.json
    - assets/branding/app_logo.png
    - assets/branding/ultimate_wallet_light.svg
    - assets/branding/ultimate_wallet_dark.svg
    - assets/icons/
    - assets/telecom/
    - assets/pay/


  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Light.ttf
          weight: 300
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Tajawal-Black.ttf
          weight: 900

